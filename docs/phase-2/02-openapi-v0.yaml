openapi: 3.0.3
info:
  title: Lebanese GIS API v0
  version: 0.1.0
  description: Core API contract for auth, projects, categories, assignments, and features.
servers:
  - url: http://localhost:3001/api/v1
    description: Local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        role: { type: string, enum: [admin, contributor, viewer] }
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register contributor account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Created
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: OK
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
  /categories:
    get:
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /categories/{categoryId}:
    put:
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    delete:
      tags: [Categories]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: categoryId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /projects:
    get:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /projects/{projectId}:
    get:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    put:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    delete:
      tags: [Projects]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: projectId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /assignments:
    get:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /assignments/{assignmentId}/status:
    patch:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /assignments/{assignmentId}:
    delete:
      tags: [Assignments]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: assignmentId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
  /features:
    get:
      tags: [Features]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
    post:
      tags: [Features]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }
  /features/{featureId}:
    get:
      tags: [Features]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: featureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    put:
      tags: [Features]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: featureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
    delete:
      tags: [Features]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: featureId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
