groups:
  - name: gis-platform
    rules:
      - alert: GisApiUnavailable
        expr: absent(up{job="gis-api"}) or up{job="gis-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: GIS API metrics endpoint is unavailable

      - alert: GisPublicHealthCheckFailed
        expr: probe_success{job="public-health"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Public HTTPS health check is failing

      - alert: GisTlsCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry{job="public-health"} - time() < 1209600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Public TLS certificate expires in less than 14 days

      - alert: GisRequiredDependencyUnavailable
        expr: gis_api_dependency_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Required GIS API dependency is unavailable

      - alert: GisApiHighErrorRate
        expr: >-
          sum(rate(gis_api_http_requests_total{status_class="5xx"}[5m]))
          /
          clamp_min(sum(rate(gis_api_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: GIS API 5xx rate is above 5 percent

      - alert: GisApiHighLatency
        expr: >-
          histogram_quantile(
            0.95,
            sum by (le) (rate(gis_api_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: GIS API p95 latency is above 2 seconds

      - alert: GisAuthenticationAttackSuspected
        expr: >-
          sum(
            rate(
              gis_api_http_requests_total{
                path=~".*/auth/(login|forgot-password|reset-password).*",
                status_class="4xx"
              }[5m]
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Sustained authentication failures detected

      - alert: GisRateLimitPressure
        expr: sum(rate(gis_api_http_requests_total{status_code="429"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Sustained API rate-limit responses detected

      - alert: GisStorageLow
        expr: gis_api_storage_available_bytes < 5368709120
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: API-managed storage has less than 5 GiB available

      - alert: GisWorkloadDeadLettered
        expr: gis_api_workload_jobs{status="dead_letter"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Durable workload jobs require operator review

      - alert: GisMediaCleanupBacklog
        expr: gis_api_media_cleanup_backlog > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Feature-media cleanup backlog is growing

      - alert: GisQuarantineBacklog
        expr: gis_api_quarantine_pending > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Upload quarantine backlog requires review

      - alert: GisMalwareDetected
        expr: gis_api_malware_detections_recent > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Malware was detected in a recent upload

      - alert: GisDatabaseBackupMissing
        expr: >-
          absent(gis_backup_last_success_timestamp_seconds)
          or
          time() - gis_backup_last_success_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: No verified database backup has been reported in 26 hours

      - alert: GisRealtimeListenerUnavailable
        expr: gis_api_realtime_listener_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL realtime event listener is unavailable

      - alert: GisRealtimeAuthenticationFailures
        expr: rate(gis_api_realtime_authentication_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Realtime authentication failures are elevated

      - alert: GisRealtimeSlowClients
        expr: rate(gis_api_realtime_slow_client_closures_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Realtime clients are being disconnected for backpressure

      - alert: GisRealtimeEventDrops
        expr: rate(gis_api_realtime_events_dropped_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Realtime invalidation events are being dropped

      - alert: GisRealtimeReconnectStorm
        expr: rate(gis_api_realtime_reconnects_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Realtime clients are reconnecting at an abnormal rate

      - alert: GisRealtimeBufferedSocketsHigh
        expr: gis_api_realtime_buffered_sockets > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Too many realtime sockets have queued outbound data
