global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: gis-platform

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: gis-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - api:3000

  - job_name: public-health
    metrics_path: /probe
    params:
      module:
        - https_internal
    static_configs:
      - targets:
          - https://nginx:8443/health
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
