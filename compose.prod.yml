services:
  db:
    build:
      context: .
      dockerfile: infra/db/Dockerfile.production
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ""
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets:
      - db_admin_password
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - ai_data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      SERVICE_NAME: gis-migrate
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
      MIGRATIONS_DIR: /app/infra/migrations
    secrets:
      - db_admin_password
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db-security:
    build:
      context: .
      dockerfile: infra/db/Dockerfile.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_OWNER_USER: ${POSTGRES_USER}
      DB_RUNTIME_USER: ${DB_RUNTIME_USER:?Set the restricted runtime database role}
      DB_ADMIN_PASSWORD_FILE: /run/secrets/db_admin_password
      DB_RUNTIME_PASSWORD_FILE: /run/secrets/db_runtime_password
    secrets:
      - db_admin_password
      - db_runtime_password
    volumes:
      - ./infra/db/security/apply-runtime-grants.sh:/opt/gis/apply-runtime-grants.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/opt/gis/apply-runtime-grants.sh"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  clamav:
    image: clamav/clamav:1.5.3@sha256:7f5389ccaa2368c383fa80e167ccfe44348d71e685f926fce4755eed1757673a
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  valkey:
    image: valkey/valkey:8.1.9-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "exec valkey-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\"",
      ]
    secrets:
      - redis_password
    volumes:
      - valkey_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "valkey-cli -a \"$$(cat /run/secrets/redis_password)\" ping 2>/dev/null | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    init: true
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      SERVICE_NAME: gis-api
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_RUNTIME_USER}
      MIGRATIONS_DIR: /app/infra/migrations
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_runtime_password
      JWT_SECRET: ""
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_SECRET_CURRENT: ""
      JWT_SECRET_CURRENT_FILE: /run/secrets/jwt_secret
      JWT_REFRESH_SECRET: ""
      JWT_REFRESH_SECRET_FILE: /run/secrets/jwt_refresh_secret
      JWT_REFRESH_SECRET_CURRENT: ""
      JWT_REFRESH_SECRET_CURRENT_FILE: /run/secrets/jwt_refresh_secret
      REDIS_PASSWORD: ""
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      METRICS_TOKEN: ""
      METRICS_TOKEN_FILE: /run/secrets/metrics_token
      SMTP_PASS: ""
      SMTP_PASS_FILE: /run/secrets/smtp_password
      SUPER_ADMIN_PASSWORD: ""
      SUPER_ADMIN_PASSWORD_FILE: /run/secrets/super_admin_password
      AI_CALLBACK_SECRET: ""
      AI_CALLBACK_SECRET_FILE: /run/secrets/ai_callback_secret
      AI_INTERNAL_API_SECRET: ""
      AI_INTERNAL_API_SECRET_FILE: /run/secrets/ai_internal_api_secret
      API_DOCS_TOKEN: ""
      API_DOCS_TOKEN_FILE: /run/secrets/api_docs_token
      PRIVACY_EXPORT_ENCRYPTION_KEY_BASE64: ""
      PRIVACY_EXPORT_ENCRYPTION_KEY_BASE64_FILE: /run/secrets/privacy_export_encryption_key
      VERIFICATION_HMAC_SECRET: ""
      VERIFICATION_HMAC_SECRET_FILE: /run/secrets/verification_hmac_secret
      STORAGE_S3_ACCESS_KEY_ID: ""
      STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/oci_s3_access_key_id
      STORAGE_S3_SECRET_ACCESS_KEY: ""
      STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/oci_s3_secret_access_key
      ARCGIS_CLIENT_ID: ""
      ARCGIS_CLIENT_ID_FILE: /run/secrets/arcgis_client_id
      ARCGIS_CLIENT_SECRET: ""
      ARCGIS_CLIENT_SECRET_FILE: /run/secrets/arcgis_client_secret
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase_service_account
      MALWARE_SCANNER_MODE: clamav
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://valkey:6379
      WORKLOAD_WORKER_MODE: external
      WORKLOAD_HARD_EXIT_ON_TIMEOUT: "true"
    secrets:
      - db_runtime_password
      - jwt_secret
      - jwt_refresh_secret
      - redis_password
      - metrics_token
      - smtp_password
      - super_admin_password
      - ai_callback_secret
      - ai_internal_api_secret
      - api_docs_token
      - privacy_export_encryption_key
      - verification_hmac_secret
      - firebase_service_account
      - oci_s3_access_key_id
      - oci_s3_secret_access_key
      - arcgis_client_id
      - arcgis_client_secret
    volumes:
      - api_uploads:/app/apps/api/uploads
      - api_exports:/app/apps/api/exports
      - ai_outputs:/app/ai-outputs:ro
    networks:
      - default
      - ai_control
    depends_on:
      db:
        condition: service_healthy
      db-security:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"

  ai-server:
    image: ${AI_SERVER_IMAGE:?Set an immutable production AI image with a sha256 digest}
    platform: ${AI_SERVER_PLATFORM:-linux/amd64}
    init: true
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      AI_DRY_RUN: "false"
      AI_SERVER_MAX_WORKERS: ${AI_MAX_CONCURRENT_RUNS:-2}
      OUTPUTS_DIR: /app/outputs
      AI_OUTPUT_DIR: /app/outputs
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${DB_RUNTIME_USER}
      DB_PASSWORD: ""
      AI_CALLBACK_SECRET: ""
      AI_INTERNAL_API_SECRET: ""
      GEE_PROJECT_ID: ${GEE_PROJECT_ID:?Set the operator-owned Earth Engine project ID}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:?Set the Earth Engine service-account email}
      GEE_ASSET_FOLDER: ${GEE_ASSET_FOLDER:?Set the approved Earth Engine asset folder}
      GEE_PRIVATE_KEY_PATH: /run/secrets/gee_service_account
      GEE_KEY_FILE: /run/secrets/gee_service_account
    secrets:
      - db_runtime_password
      - ai_callback_secret
      - ai_internal_api_secret
      - gee_service_account
    volumes:
      - ai_outputs:/app/outputs
    networks:
      - ai_control
      - ai_data
      - ai_egress
    depends_on:
      db:
        condition: service_healthy
      db-security:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export DB_PASSWORD="$$(tr -d '\r\n' < /run/secrets/db_runtime_password)";
        export AI_CALLBACK_SECRET="$$(tr -d '\r\n' < /run/secrets/ai_callback_secret)";
        export AI_INTERNAL_API_SECRET="$$(tr -d '\r\n' < /run/secrets/ai_internal_api_secret)";
        exec python -m uvicorn ai_server:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' and data.get('dry_run') is False else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${AI_SERVER_PIDS_LIMIT:-512}
    mem_limit: ${AI_SERVER_MEMORY_LIMIT:-12g}
    cpus: ${AI_SERVER_CPU_LIMIT:-4}
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"

  workload-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    init: true
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      SERVICE_NAME: gis-workload-worker
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_RUNTIME_USER}
      MIGRATIONS_DIR: /app/infra/migrations
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_runtime_password
      PRIVACY_EXPORT_ENCRYPTION_KEY_BASE64: ""
      PRIVACY_EXPORT_ENCRYPTION_KEY_BASE64_FILE: /run/secrets/privacy_export_encryption_key
      STORAGE_S3_ACCESS_KEY_ID: ""
      STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/oci_s3_access_key_id
      STORAGE_S3_SECRET_ACCESS_KEY: ""
      STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/oci_s3_secret_access_key
      WORKLOAD_WORKER_MODE: external
      WORKLOAD_HARD_EXIT_ON_TIMEOUT: "true"
    secrets:
      - db_runtime_password
      - privacy_export_encryption_key
      - oci_s3_access_key_id
      - oci_s3_secret_access_key
    volumes:
      - api_uploads:/app/apps/api/uploads
      - api_exports:/app/apps/api/exports
      - ai_outputs:/app/ai-outputs:ro
    depends_on:
      db:
        condition: service_healthy
      db-security:
        condition: service_completed_successfully
    command: ["node", "dist/jobs/runWorkloadWorker.js"]
    healthcheck:
      test: ["CMD", "node", "dist/jobs/checkWorkloadWorkerHealth.js"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "10"

  database-backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: backup
    env_file:
      - ${API_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ""
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
      STORAGE_S3_ACCESS_KEY_ID: ""
      STORAGE_S3_ACCESS_KEY_ID_FILE: /run/secrets/oci_backup_s3_access_key_id
      STORAGE_S3_SECRET_ACCESS_KEY: ""
      STORAGE_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/oci_backup_s3_secret_access_key
      BACKUP_ENCRYPTION_KEY_BASE64: ""
      BACKUP_ENCRYPTION_KEY_BASE64_FILE: /run/secrets/backup_encryption_key
      BACKUP_TEMP_DIR: /backup-work
    secrets:
      - db_admin_password
      - oci_backup_s3_access_key_id
      - oci_backup_s3_secret_access_key
      - backup_encryption_key
    volumes:
      - database_backup_work:/backup-work
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/jobs/runDatabaseBackup.js"]
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  nginx:
    image: nginxinc/nginx-unprivileged:1.31.3-alpine3.24@sha256:59ccf0943b0b8e8d9e6ea9039a39555730f544701a655c596f7df7d096c593f5
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set the public DNS hostname}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOSTNAME$
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
      - "${NGINX_HTTPS_PORT:-443}:8443"
    volumes:
      - ./infra/nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./apps/mobile/build/web:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command:
      [
        "/bin/sh",
        "-c",
        "(while sleep 21600; do nginx -s reload; done) & exec nginx -g 'daemon off;'",
      ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -q -O /dev/null https://127.0.0.1:8443/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=64m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "10"

  certbot-renew:
    build:
      context: .
      dockerfile: infra/certbot/Dockerfile.production
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        trap exit TERM;
        while :; do
          certbot renew --webroot --webroot-path /var/www/certbot --quiet;
          chown -R 101:101 /etc/letsencrypt/live /etc/letsencrypt/archive 2>/dev/null || true;
          find /etc/letsencrypt/live /etc/letsencrypt/archive -type f -exec chmod 0640 {} \; 2>/dev/null || true;
          sleep 43200 & wait $$!;
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  certbot-bootstrap:
    build:
      context: .
      dockerfile: infra/certbot/Dockerfile.production
    profiles:
      - certificate-bootstrap
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set the public DNS hostname}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?Set the certificate contact email}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        case "$$PUBLIC_HOSTNAME" in ""|*[!A-Za-z0-9.-]*) echo "Invalid PUBLIC_HOSTNAME" >&2; exit 1;; esac;
        case "$$CERTBOT_EMAIL" in *@*.*) ;; *) echo "Invalid CERTBOT_EMAIL" >&2; exit 1;; esac;
        certbot certonly --standalone --http-01-port 8080 --non-interactive
        --agree-tos --no-eff-email --email "$$CERTBOT_EMAIL" -d "$$PUBLIC_HOSTNAME";
        chown -R 101:101 /etc/letsencrypt/live /etc/letsencrypt/archive;
        find /etc/letsencrypt/live /etc/letsencrypt/archive -type f -exec chmod 0640 {} \;
    ports:
      - "${NGINX_HTTP_PORT:-80}:8080"
    volumes:
      - letsencrypt:/etc/letsencrypt
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/letsencrypt:rw,noexec,nosuid,size=64m
      - /var/log/letsencrypt:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  db_admin_password:
    file: ${DB_ADMIN_PASSWORD_SECRET_FILE:-./secrets/db_admin_password.txt}
  db_runtime_password:
    file: ${DB_RUNTIME_PASSWORD_SECRET_FILE:-./secrets/db_runtime_password.txt}
  jwt_secret:
    file: ${JWT_SECRET_FILE_HOST:-./secrets/jwt_secret.txt}
  jwt_refresh_secret:
    file: ${JWT_REFRESH_SECRET_FILE_HOST:-./secrets/jwt_refresh_secret.txt}
  redis_password:
    file: ${REDIS_PASSWORD_SECRET_FILE:-./secrets/redis_password.txt}
  metrics_token:
    file: ${METRICS_TOKEN_SECRET_FILE:-./secrets/metrics_token.txt}
  smtp_password:
    file: ${SMTP_PASSWORD_SECRET_FILE:-./secrets/smtp_password.txt}
  super_admin_password:
    file: ${SUPER_ADMIN_PASSWORD_SECRET_FILE:-./secrets/super_admin_password.txt}
  ai_callback_secret:
    file: ${AI_CALLBACK_SECRET_FILE_HOST:-./secrets/ai_callback_secret.txt}
  ai_internal_api_secret:
    file: ${AI_INTERNAL_API_SECRET_FILE_HOST:-./secrets/ai_internal_api_secret.txt}
  api_docs_token:
    file: ${API_DOCS_TOKEN_SECRET_FILE:-./secrets/api_docs_token.txt}
  privacy_export_encryption_key:
    file: ${PRIVACY_EXPORT_ENCRYPTION_KEY_SECRET_FILE:-./secrets/privacy_export_encryption_key.txt}
  verification_hmac_secret:
    file: ${VERIFICATION_HMAC_SECRET_FILE_HOST:-./secrets/verification_hmac_secret.txt}
  firebase_service_account:
    file: ${FIREBASE_SERVICE_ACCOUNT_SECRET_FILE:-./secrets/firebase_service_account.json}
  oci_s3_access_key_id:
    file: ${OCI_S3_ACCESS_KEY_ID_SECRET_FILE:-./secrets/oci_s3_access_key_id.txt}
  oci_s3_secret_access_key:
    file: ${OCI_S3_SECRET_ACCESS_KEY_SECRET_FILE:-./secrets/oci_s3_secret_access_key.txt}
  oci_backup_s3_access_key_id:
    file: ${OCI_BACKUP_S3_ACCESS_KEY_ID_SECRET_FILE:-./secrets/oci_backup_s3_access_key_id.txt}
  oci_backup_s3_secret_access_key:
    file: ${OCI_BACKUP_S3_SECRET_ACCESS_KEY_SECRET_FILE:-./secrets/oci_backup_s3_secret_access_key.txt}
  backup_encryption_key:
    file: ${BACKUP_ENCRYPTION_KEY_SECRET_FILE:-./secrets/backup_encryption_key.txt}
  arcgis_client_id:
    file: ${ARCGIS_CLIENT_ID_SECRET_FILE:-./secrets/arcgis_client_id.txt}
  arcgis_client_secret:
    file: ${ARCGIS_CLIENT_SECRET_FILE:-./secrets/arcgis_client_secret.txt}
  gee_service_account:
    file: ${GEE_SERVICE_ACCOUNT_SECRET_FILE:-./secrets/gee_service_account.json}

volumes:
