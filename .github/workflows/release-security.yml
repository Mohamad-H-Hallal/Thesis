name: Release Security Gates

permissions:
  contents: read

concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - handover-ready
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2'

jobs:
  source-security:
    name: Dependency + Secret Scans
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan complete Git history for secrets
        run: >-
          docker run --rm
          --cap-drop ALL
          --security-opt no-new-privileges
          --volume "$GITHUB_WORKSPACE:/repo:ro"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner .

      - name: Scan npm and Dart dependency graphs
        run: >-
          docker run --rm
          --cap-drop ALL
          --security-opt no-new-privileges
          --volume "$GITHUB_WORKSPACE:/src:ro"
          ghcr.io/google/osv-scanner:v2.4.0@sha256:5116601dedc01c1c580eb92371883ec052fc4c13c3fbc109d621a63ac416d475
          scan source --recursive /src

  api-release-image:
    name: API Release Image Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Build production API image
        run: >-
          docker build
          --tag gis-phase6-api-audit:local
          --file apps/api/Dockerfile
          .

      - name: Reject Critical/High release-image findings
        run: node scripts/scan-release-images.js --only-api
