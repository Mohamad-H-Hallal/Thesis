name: Reusable API Release Gate

permissions:
  contents: read

on:
  workflow_call:

jobs:
  api-release-gate:
    name: API Release Gate
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.5-alpine@sha256:0d14e6c83a1bde7e453c2a5fb41785279992cb5793073a686f4f9e8ec2c5b077
        env:
          POSTGRES_DB: gis_app
          POSTGRES_USER: gis_user
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis_user -d gis_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:8.1.9-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      NODE_ENV: test
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: gis_app_test
      TEST_DB_USER: gis_user
      TEST_DB_PASSWORD: change_me
      TEST_DB_ADMIN_DB: postgres
      MIGRATIONS_DIR: ${{ github.workspace }}/infra/migrations
      JWT_SECRET: phase10-ci-jwt-secret-12345678901234567890
      JWT_SECRET_CURRENT: phase10-ci-jwt-secret-12345678901234567890
      JWT_REFRESH_SECRET: phase10-ci-refresh-secret-1234567890123456
      JWT_REFRESH_SECRET_CURRENT: phase10-ci-refresh-secret-1234567890123456
      CORS_ORIGIN: http://localhost:3000
      CORS_STRICT: false
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 1000
      RATE_LIMIT_AUTH_MAX_REQUESTS: 1000
      RATE_LIMIT_EXPORT_MAX_REQUESTS: 1000
      PHASE4_REDIS_URL: redis://localhost:6379
      PERF_BBOX_MAX_MS: 3000
      PERF_EXPORT_MAX_MS: 45000
      PERF_EXPORT_TIMEOUT_MS: 60000
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Validate CI environment
        run: |
          node -e "const required = ['TEST_DB_HOST','TEST_DB_PORT','TEST_DB_NAME','TEST_DB_USER','TEST_DB_PASSWORD','JWT_SECRET_CURRENT','JWT_REFRESH_SECRET_CURRENT']; const missing = required.filter((key) => !process.env[key]); if (missing.length) { console.error(`Missing required CI env vars: ${missing.join(', ')}`); process.exit(1); } console.log('CI environment validated');"

      - name: Install
        run: npm ci

      - name: Wait for PostGIS
        run: |
          node -e "const { Client } = require('pg'); let retries = 30; const run = async () => { while (retries-- > 0) { const client = new Client({ host: process.env.TEST_DB_HOST, port: Number(process.env.TEST_DB_PORT), database: process.env.TEST_DB_ADMIN_DB || 'postgres', user: process.env.TEST_DB_USER, password: process.env.TEST_DB_PASSWORD }); try { await client.connect(); await client.query('select 1'); await client.end(); console.log('PostGIS is ready'); process.exit(0); } catch (err) { try { await client.end(); } catch {} if (retries <= 0) { console.error(err); process.exit(1); } await new Promise((r) => setTimeout(r, 2000)); } } }; run();"

      - name: Prepare Test DB
        run: npm run test:db:prepare

      - name: OpenAPI Contract Check
        run: npm run openapi:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (Unit/Integration/E2E)
        run: npm run test:ci

      - name: Test (Performance)
        run: npm run test:perf

      - name: Audit (Production deps)
        run: npm run audit:prod
