name: API CI

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable-api-release-gate.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable-api-release-gate.yml'

jobs:
  api-release-gate:
    uses: ./.github/workflows/reusable-api-release-gate.yml
