name: API CI

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable-api-release-gate.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/reusable-api-release-gate.yml'

jobs:
  api-release-gate:
    uses: ./.github/workflows/reusable-api-release-gate.yml
