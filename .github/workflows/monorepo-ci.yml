name: Monorepo Validation

permissions:
  contents: read

concurrency:
  group: monorepo-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/monorepo-ci.yml'
      - '.github/workflows/reusable-api-release-gate.yml'
      - 'README.md'
      - '.env.example'
      - '.env.dev.example'
      - '.env.staging.example'
      - '.env.prod.example'
      - 'compose.prod.yml'
      - 'docker-compose.yml'
      - 'docker-compose.override.yml'
      - 'scripts/verify_all.ps1'
  pull_request: {}

jobs:
  api:
    uses: ./.github/workflows/reusable-api-release-gate.yml

  mobile:
    name: Flutter Analyze + Test + Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      MOBILE_MIN_LINE_COVERAGE: 19
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test with coverage
        run: flutter test --coverage
      - name: Enforce Flutter coverage threshold
        run: dart run tool/check_coverage.dart --min-line ${{ env.MOBILE_MIN_LINE_COVERAGE }}
