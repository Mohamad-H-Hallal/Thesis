name: Monorepo CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    uses: ./.github/workflows/reusable-api-release-gate.yml

  mobile:
    name: Flutter Analyze + Test + Coverage Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      MOBILE_MIN_LINE_COVERAGE: 19
    steps:
      - uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter test with coverage
        run: flutter test --coverage
      - name: Enforce Flutter coverage threshold
        run: dart run tool/check_coverage.dart --min-line ${{ env.MOBILE_MIN_LINE_COVERAGE }}
