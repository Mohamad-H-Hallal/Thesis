openapi: 3.0.3
info:
  title: Lebanese GIS Mobile Application API
  version: 1.1.0
  description: >
    Government field data collection API for projects, assignments, geospatial features,
    exports, notifications, and administration.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (primary)
  - url: http://localhost:3000/api
    description: Legacy compatibility prefix (optional)
tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: Features
  - name: Assignments
  - name: Photos
  - name: Categories
  - name: Notifications
  - name: Exports
  - name: Users
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      responses:
        '200':
          description: Service is live
  /ready:
    get:
      tags: [System]
      summary: Readiness check (database)
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      tags: [System]
      summary: Metrics snapshot (token protected in production)
      responses:
        '200':
          description: Metrics payload
        '401':
          description: Unauthorized
  /api/v1:
    get:
      tags: [System]
      summary: API metadata
      responses:
        '200':
          description: Metadata response

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register public user (contributor/viewer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation failed
        '409':
          description: Email already exists
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation failed
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '400':
          description: Validation failed
        '401':
          description: Invalid refresh token
  /api/v1/auth/me:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Current authenticated profile
      responses:
        '200':
          description: Profile returned
        '401':
          description: Not authenticated
    put:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Update own profile
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation failed
        '401':
          description: Not authenticated
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Change own password
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation failed
        '401':
          description: Not authenticated or invalid current password
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout (client token disposal event)
      responses:
        '200':
          description: Logout acknowledged

  /api/v1/projects:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: List projects accessible to current user
      responses:
        '200':
          description: Project list
        '401':
          description: Unauthorized
    post:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Create project (admin only)
      responses:
        '201':
          description: Project created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Get project by ID
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Update project (system admin or project admin)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Archive project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project archived
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/stats:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project statistics
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project statistics
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/features:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project features list
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project features
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/features:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: List features with filters
      responses:
        '200':
          description: Feature list
        '401':
          description: Unauthorized
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Create feature
      responses:
        '201':
          description: Feature created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/batch:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Batch create features (offline sync)
      responses:
        '201':
          description: Batch created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/nearby:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Find nearby approved features
      responses:
        '200':
          description: Nearby features
        '400':
          description: Invalid query
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/bbox:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Query features by BBOX (GeoJSON FeatureCollection)
      parameters:
        - in: query
          name: minLon
          required: true
          schema:
            type: number
        - in: query
          name: minLat
          required: true
          schema:
            type: number
        - in: query
          name: maxLon
          required: true
          schema:
            type: number
        - in: query
          name: maxLat
          required: true
          schema:
            type: number
      responses:
        '200':
          description: GeoJSON feature collection
        '400':
          description: Invalid query
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/{featureId}:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Get feature by ID
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Update draft feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Delete draft feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/features/{featureId}/submit:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Submit feature for review
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Submission accepted
        '400':
          description: Invalid state
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/features/{featureId}/review:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Approve or reject submitted feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Review completed
        '400':
          description: Invalid review payload/state
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/assignments:
    get:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Get current user assignments
      responses:
        '200':
          description: Assignment list
        '401':
          description: Unauthorized
    post:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Create assignment
      responses:
        '201':
          description: Assignment created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/assignments/project/{projectId}:
    get:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Get assignments for a project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Assignment list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/assignments/join/{projectId}:
    post:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Request to join project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '201':
          description: Join request created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Duplicate request
  /api/v1/assignments/{assignmentId}:
    put:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Approve or reject assignment
      parameters:
        - $ref: '#/components/parameters/assignmentId'
      responses:
        '200':
          description: Assignment updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Remove assignment
      parameters:
        - $ref: '#/components/parameters/assignmentId'
      responses:
        '200':
          description: Assignment removed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/photos/feature/{featureId}:
    post:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Upload feature photos
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '201':
          description: Photos uploaded
        '400':
          description: Validation/upload error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    get:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: List photos for feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Photo list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/photos/{photoId}:
    get:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Get photo file
      parameters:
        - $ref: '#/components/parameters/photoId'
      responses:
        '200':
          description: Photo content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Delete photo
      parameters:
        - $ref: '#/components/parameters/photoId'
      responses:
        '200':
          description: Photo deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/photos/{photoId}/order:
    put:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Update photo display order
      parameters:
        - $ref: '#/components/parameters/photoId'
      responses:
        '200':
          description: Order updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/categories:
    get:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: List project categories
      responses:
        '200':
          description: Category list
        '401':
          description: Unauthorized
    post:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Create category (admin only)
      responses:
        '201':
          description: Category created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/categories/{categoryId}:
    get:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Get category by ID
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category detail
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Update category (admin only)
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Delete category (admin only)
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/notifications:
    get:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: List current user notifications
      responses:
        '200':
          description: Notification list
        '401':
          description: Unauthorized
  /api/v1/notifications/unread/count:
    get:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Unread notification count
      responses:
        '200':
          description: Unread count
        '401':
          description: Unauthorized
  /api/v1/notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Mark notification as read
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: Notification updated
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /api/v1/notifications/read-all:
    put:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Mark all notifications as read
      responses:
        '200':
          description: Notifications updated
        '401':
          description: Unauthorized
  /api/v1/notifications/{notificationId}:
    delete:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Delete notification
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: Notification deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/v1/exports:
    get:
      tags: [Exports]
      security:
        - bearerAuth: []
      summary: List current user export jobs
      responses:
        '200':
          description: Export list
        '401':
          description: Unauthorized
  /api/v1/exports/project/{projectId}:
    post:
      tags: [Exports]
      security:
        - bearerAuth: []
      summary: Request project export
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '202':
          description: Export queued
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/exports/{exportId}:
    get:
      tags: [Exports]
      security:
        - bearerAuth: []
      summary: Export status detail
      parameters:
        - $ref: '#/components/parameters/exportId'
      responses:
        '200':
          description: Export status
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/exports/{exportId}/download:
    get:
      tags: [Exports]
      security:
        - bearerAuth: []
      summary: Download completed export
      parameters:
        - $ref: '#/components/parameters/exportId'
      responses:
        '200':
          description: Download started
        '400':
          description: Export not ready
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/users:
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: List users (admin only)
      responses:
        '200':
          description: User list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/users/{userId}:
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: User detail (admin only)
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: Update user (admin only)
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/users/{userId}/deactivate:
    post:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: Deactivate user (admin only)
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User deactivated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/users/{userId}/stats:
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: User productivity stats (admin only)
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: User stats
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    projectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    featureId:
      in: path
      name: featureId
      required: true
      schema:
        type: string
        format: uuid
    assignmentId:
      in: path
      name: assignmentId
      required: true
      schema:
        type: string
        format: uuid
    photoId:
      in: path
      name: photoId
      required: true
      schema:
        type: string
        format: uuid
    categoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
        format: uuid
    exportId:
      in: path
      name: exportId
      required: true
      schema:
        type: string
        format: uuid
    userId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [contributor, viewer]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
