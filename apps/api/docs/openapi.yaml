openapi: 3.0.3
info:
  title: Lebanese GIS Mobile Application API
  version: 1.1.0
  description: >
    Government field data collection API for projects, assignments, geospatial features,
    exports, notifications, and administration.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (primary)
  - url: http://localhost:3000/api
    description: Legacy compatibility prefix (optional)
tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: AI
  - name: Features
  - name: Assignments
  - name: Photos
  - name: Categories
  - name: Notifications
  - name: Exports
  - name: Imports
  - name: Users
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      responses:
        '200':
          description: Service is live
  /ready:
    get:
      tags: [System]
      summary: Readiness check (database)
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      tags: [System]
      summary: Metrics snapshot (token protected in production)
      responses:
        '200':
          description: Metrics payload
        '401':
          description: Unauthorized
  /api/v1:
    get:
      tags: [System]
      summary: API metadata
      responses:
        '200':
          description: Metadata response

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register public user (contributor/viewer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation failed
        '409':
          description: Email already exists
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation failed
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '400':
          description: Validation failed
        '401':
          description: Invalid refresh token
  /api/v1/auth/me:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Current authenticated profile
      responses:
        '200':
          description: Profile returned
        '401':
          description: Not authenticated
    put:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Update own profile
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation failed
        '401':
          description: Not authenticated
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Change own password
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation failed
        '401':
          description: Not authenticated or invalid current password
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout (client token disposal event)
      responses:
        '200':
          description: Logout acknowledged

  /api/v1/projects:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: List projects accessible to current user
      responses:
        '200':
          description: Project list
        '401':
          description: Unauthorized
    post:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Create project (admin only)
      responses:
        '201':
          description: Project created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Get project by ID
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Update project (system admin or project admin)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Archive project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project archived
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/stats:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project statistics
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project statistics
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/features:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project features list
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project features
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/ai/readiness:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Check whether approved project data is ready for AI training
      description: Protected super-admin only. Read-only readiness probe. Does not run GEE, train models, classify, or write AI outputs.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: label_field
          schema:
            type: string
        - in: query
          name: min_samples_per_class
          schema:
            type: integer
            minimum: 1
        - in: query
          name: scope_type
          schema:
            type: string
            enum: [project, governorate, district, city, custom_polygon, national]
      responses:
        '200':
          description: AI readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReadinessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/settings:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get project AI settings
      description: Protected super-admin only.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: AI settings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    put:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Save project AI settings
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProjectSettingsRequest'
      responses:
        '200':
          description: AI settings saved
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    patch:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Patch project AI settings
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProjectSettingsRequest'
      responses:
        '200':
          description: AI settings saved
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/runs:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List project AI runs
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                draft,
                queued,
                extracting_features,
                training,
                evaluating,
                classifying,
                ready_for_review,
                published,
                failed,
                cancelled,
              ]
      responses:
        '200':
          description: AI run list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Create a draft or queued AI run record without worker execution
      description: Creates only an ai_run row and ai_run_log entry. Phase F execution modes are limited to mock, dry-run, local-only ground-truth export, regional feature extraction, or regional model evaluation. National classification, publishing, and DB output insertion are not started.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRunCreateRequest'
      responses:
        '201':
          description: AI run record created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Readiness blockers prevent queueing
  /api/v1/ai/runs/{runId}:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get AI run detail
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/metrics:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI run metrics
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI metric list
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/layers:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI output layer metadata
      description: Returns reviewable AI layer metadata only. AI outputs are not inserted into spatial_feature and are not published to viewers in Phase B.
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI output layer list
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/logs:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI run logs
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run log list
        '403':
          description: Forbidden
        '404':
          description: AI run not found

  /api/v1/features:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: List features with filters
      responses:
        '200':
          description: Feature list
        '401':
          description: Unauthorized
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Create feature
      responses:
        '201':
          description: Feature created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/batch:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Batch create features (offline sync)
      responses:
        '201':
          description: Batch created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/nearby:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Find nearby approved features
      responses:
        '200':
          description: Nearby features
        '400':
          description: Invalid query
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/bbox:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Query features by BBOX (GeoJSON FeatureCollection)
      parameters:
        - in: query
          name: minLon
          required: true
          schema:
            type: number
        - in: query
          name: minLat
          required: true
          schema:
            type: number
        - in: query
          name: maxLon
          required: true
          schema:
            type: number
        - in: query
          name: maxLat
          required: true
          schema:
            type: number
      responses:
        '200':
          description: GeoJSON feature collection
        '400':
          description: Invalid query
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/{featureId}:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Get feature by ID
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Update draft feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Delete draft feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/features/{featureId}/submit:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Submit feature for review
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Submission accepted
        '400':
          description: Invalid state
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/features/{featureId}/review:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Approve or reject submitted feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Review completed
        '400':
          description: Invalid review payload/state
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/assignments:
    get:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Get current user assignments
      responses:
        '200':
          description: Assignment list
        '401':
          description: Unauthorized
    post:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Create assignment
      responses:
        '201':
          description: Assignment created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/assignments/project/{projectId}:
    get:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Get assignments for a project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Assignment list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/assignments/join/{projectId}:
    post:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Request to join project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '201':
          description: Join request created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Duplicate request
  /api/v1/assignments/{assignmentId}:
    put:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Approve or reject assignment
      parameters:
        - $ref: '#/components/parameters/assignmentId'
      responses:
        '200':
          description: Assignment updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Assignments]
      security:
        - bearerAuth: []
      summary: Remove assignment
      parameters:
        - $ref: '#/components/parameters/assignmentId'
      responses:
        '200':
          description: Assignment removed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/photos/feature/{featureId}:
    post:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Upload feature photos
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '201':
          description: Photos uploaded
        '400':
          description: Validation/upload error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    get:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: List photos for feature
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Photo list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/photos/{photoId}:
    get:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Get photo file
      parameters:
        - $ref: '#/components/parameters/photoId'
      responses:
        '200':
          description: Photo content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Delete photo
      parameters:
        - $ref: '#/components/parameters/photoId'
      responses:
        '200':
          description: Photo deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/photos/{photoId}/order:
    put:
      tags: [Photos]
      security:
        - bearerAuth: []
      summary: Update photo display order
      parameters:
        - $ref: '#/components/parameters/photoId'
      responses:
        '200':
          description: Order updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/categories:
    get:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: List project categories
      responses:
        '200':
          description: Category list
        '401':
          description: Unauthorized
    post:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Create category (admin only)
      responses:
        '201':
          description: Category created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/categories/{categoryId}:
    get:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Get category by ID
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category detail
        '401':
          description: Unauthorized
        '404':
          description: Not found
    put:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Update category (admin only)
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Categories]
      security:
        - bearerAuth: []
      summary: Delete category (admin only)
      parameters:
        - $ref: '#/components/parameters/categoryId'
      responses:
        '200':
          description: Category deleted
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found

  /api/v1/notifications:
    get:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: List current user notifications
      responses:
        '200':
          description: Notification list
        '401':
          description: Unauthorized
  /api/v1/notifications/unread/count:
    get:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Unread notification count
      responses:
        '200':
          description: Unread count
        '401':
          description: Unauthorized
  /api/v1/notifications/{notificationId}/read:
    put:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Mark notification as read
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: Notification updated
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /api/v1/notifications/read-all:
    put:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Mark all notifications as read
      responses:
        '200':
          description: Notifications updated
        '401':
          description: Unauthorized
  /api/v1/notifications/{notificationId}:
    delete:
      tags: [Notifications]
      security:
        - bearerAuth: []
      summary: Delete notification
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: Notification deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found

  /api/v1/exports:
    get:
      tags: [Exports]
      security:
        - bearerAuth: []
      summary: List current user export jobs
      responses:
        '200':
          description: Export list
        '401':
          description: Unauthorized
  /api/v1/exports/project/{projectId}:
    post:
      tags: [Exports]
      security:
        - bearerAuth: []
      summary: Request project export
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                format:
                  type: string
                  enum: [geojson, shapefile]
                  default: geojson
                status_filter:
                  type: array
                  items:
                    type: string
                    enum: [draft, submitted, approved, rejected]
                  default: [approved]
                date_from:
                  type: string
                  format: date
                date_to:
                  type: string
                  format: date
                bbox:
                  type: string
                  description: minLon,minLat,maxLon,maxLat
                export_polygon:
                  description: GeoJSON Polygon in EPSG:4326, sent as an object or JSON string.
                  oneOf:
                    - type: object
                    - type: string
                feature_type:
                  type: string
                  description: Feature type value stored in feature_type, type, or class attributes.
                include_photos:
                  type: boolean
                  default: true
                geometry_types:
                  type: array
                  items:
                    type: string
                    enum: [Point, LineString, Polygon, MultiPoint, MultiLineString, MultiPolygon]
      responses:
        '202':
          description: Export queued
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
