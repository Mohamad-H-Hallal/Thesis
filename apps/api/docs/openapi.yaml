components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    projectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    featureId:
      in: path
      name: featureId
      required: true
      schema:
        type: string
        format: uuid
    assignmentId:
      in: path
      name: assignmentId
      required: true
      schema:
        type: string
        format: uuid
    photoId:
      in: path
      name: photoId
      required: true
      schema:
        type: string
        format: uuid
    categoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
        format: uuid
    exportId:
      in: path
      name: exportId
      required: true
      schema:
        type: string
        format: uuid
    importId:
      in: path
      name: importId
      required: true
      schema:
        type: string
        format: uuid
    userId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    runId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
    layerId:
      in: path
      name: layerId
      required: true
      schema:
        type: string
        format: uuid
    uncertaintyAreaId:
      in: path
      name: uncertaintyAreaId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [contributor, viewer]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    AiProjectSettingsRequest:
      type: object
      properties:
        is_enabled:
          type: boolean
        label_field:
          type: string
          nullable: true
        scope_type:
          type: string
          enum: [project, governorate, district, city, custom_polygon, national]
        scope_geometry:
          type: object
          nullable: true
          description: GeoJSON Polygon, MultiPolygon, or GeometryCollection for custom scope.
        min_samples_per_class:
          type: integer
          minimum: 1
        model_preferences:
          type: object
    AiRunCreateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [draft, queued]
          default: draft
        label_field:
          type: string
        scope_type:
          type: string
          enum: [project, governorate, district, city, custom_polygon, national]
        scope_geometry:
          type: object
          nullable: true
        region_preset:
          type: string
          nullable: true
        min_samples_per_class:
          type: integer
          minimum: 1
        execution_mode:
          type: string
          enum:
            - mock
            - dry_run
            - local_ground_truth_export
            - regional_feature_extraction
            - regional_model_eval
            - regional_classification
            - regional_vectorization_artifacts
          default: mock
          description: Safe worker mode. Regional classification/vectorization modes prepare review artifacts only; national classification, viewer publishing, spatial_feature insertion, and Redis-backed queueing remain unavailable.
    AiRunReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - approve_for_publication
            - reject
            - request_more_data
            - keep_draft
          description: Review action for protected super-admins. Approving prepares results for a later publishing phase; it does not publish to viewers.
        reason:
          type: string
          nullable: true
          maxLength: 4000
          description: Required for reject and request_more_data.
    AiUncertaintyAssignRequest:
      type: object
      required: [assigned_to]
      properties:
        assigned_to:
          type: string
          format: uuid
          description: Approved contributor user assigned to validate the task.
        notes:
          type: string
          nullable: true
          maxLength: 2000
    AiUncertaintyStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [open, assigned, in_progress, in_review, validated, rejected, cancelled, dismissed]
        validated_feature_id:
          type: string
          format: uuid
          nullable: true
          description: Existing same-project spatial_feature linked through the normal feature review workflow. Required before marking a task validated, and that feature must already be approved.
        notes:
          type: string
          nullable: true
          maxLength: 2000
    AiUncertaintySubmitValidationRequest:
      type: object
      required: [validated_feature_id]
      properties:
        validated_feature_id:
          type: string
          format: uuid
          description: Contributor-owned draft or pending-review spatial_feature in the same project. Drafts are submitted to pending_review; they are not auto-approved.
        notes:
          type: string
          nullable: true
          maxLength: 2000
    AiReadinessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            project:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            settings:
              type: object
            readiness:
              type: object
              properties:
                status:
                  type: string
                  enum: [ready, warning, not_ready]
                label_field:
                  type: string
                  nullable: true
                approved_feature_count:
                  type: integer
                labeled_feature_count:
                  type: integer
                  description: Approved features with valid geometry and a non-empty selected label.
                eligible_feature_count:
                  type: integer
                  description: Samples in classes that meet the configured minimum sample threshold.
                missing_label_count:
                  type: integer
                invalid_geometry_count:
                  type: integer
                excluded_feature_count:
                  type: integer
                  description: Approved features excluded because of missing labels, invalid geometry, or low-count classes.
                eligible_class_count:
                  type: integer
                  description: Number of classes that meet the configured minimum sample threshold.
                label_counts:
                  type: array
                  items:
                    type: object
                classes_below_minimum:
                  type: array
                  items:
                    type: object
                candidate_label_fields:
                  type: array
                  description: Label-field candidates derived from project schema, approved feature attributes, and current AI settings.
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      source:
                        type: array
                        items:
                          type: string
                      labeled_feature_count:
                        type: integer
                      class_count:
                        type: integer
                      usable:
                        type: boolean
                      classifier_candidate:
                        type: boolean
                        description: Whether the field passed classifier-field heuristics before alias filtering.
                      selectable:
                        type: boolean
                        description: Whether the field should appear as a primary classifier choice.
                      diagnostic_only:
                        type: boolean
                        description: True for aliases or fields without usable labels.
                      alias_of:
                        type: string
                        nullable: true
                        description: Primary classifier field when this candidate is an equivalent alias.
                      aliases:
                        type: array
                        items:
                          type: string
                        description: Equivalent fields mapped to this primary classifier field.
                      hidden_reason:
                        type: string
                        nullable: true
                        description: Reason the field is diagnostic-only when it is not selectable.
                      recommended:
                        type: boolean
                      note:
                        type: string
                source_counts:
                  type: array
                  items:
                    type: object
                warnings:
                  type: array
                  items:
                    type: string
                blockers:
                  type: array
                  items:
                    type: string
