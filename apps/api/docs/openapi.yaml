openapi: 3.0.3
info:
  title: TerraLeb API
  version: 1.2.0
  description: >
    Government field data collection API for projects, assignments, geospatial features,
    exports, notifications, and administration.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (primary)
  - url: http://localhost:3000/api
    description: Legacy compatibility prefix (optional)
tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: AI
  - name: Features
  - name: Assignments
  - name: Photos
  - name: Categories
  - name: Notifications
  - name: Exports
  - name: Imports
  - name: Users
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      responses:
        '200':
          description: Service is live
  /ready:
    get:
      tags: [System]
      summary: Readiness check (database)
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      tags: [System]
      summary: Metrics snapshot (token protected in production)
      responses:
        '200':
          description: Metrics payload
        '401':
          description: Unauthorized
  /api/v1:
    get:
      tags: [System]
      summary: API metadata
      responses:
        '200':
          description: Metadata response

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register public user (contributor/viewer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Pending user created with a limited verification-session token; no full-access JWT is issued
        '400':
          description: Validation failed
        '409':
          description: Email already exists, or the normalized mobile number is already used by three accounts
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation failed
        '401':
          description: Invalid credentials
        '403':
          description: Contact verification or account approval is still required
        '429':
          description: Rate limited
  /api/v1/auth/verification/status:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Resume a limited contact-verification session
      responses:
        '200':
          description: Masked destinations and required next step
        '401':
          description: Verification session invalid, expired, or replaced
  /api/v1/auth/verification/email/send:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Send or resend the signup/invitation email verification code
      responses:
        '200':
          description: Generic delivery acknowledgement and cooldown
        '429':
          description: Cooldown, target, account, IP, or device limit reached
  /api/v1/auth/verification/email/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Confirm email ownership with a single-use code
      responses:
        '200':
          description: Email verified; completed signups must explicitly sign in, while sms_otp deployments continue to phone ownership verification
        '400':
          description: Code invalid, expired, used, or replaced
  /api/v1/auth/verification/pending-signup:
    delete:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Remove the caller's unfinished, unverified self-signup
      description: Requires the limited verification-session token. Verified, invited, admin, and legacy accounts cannot be deleted through this endpoint.
      responses:
        '200':
          description: Pending user and active verification challenges removed
        '409':
          description: Account is not eligible for pending-signup cancellation
  /api/v1/auth/verification/phone/validate:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Validate and normalize a Lebanese mobile number under the configured format policy
      description: Available only in format_only mode. The default provider uses maintained local libphonenumber metadata without a network account. This endpoint does not send an SMS and does not prove possession, assignment, or reachability.
      responses:
        '200':
          description: Format assurance recorded separately from ownership verification; completed signups must explicitly sign in
        '400':
          description: Number is not a structurally valid Lebanese mobile number
        '409':
          description: SMS ownership verification is required by the configured policy
        '429':
          description: Cooldown, target, account, IP, or device limit reached
        '503':
          description: Configured external format provider unavailable
  /api/v1/auth/verification/phone/send:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Send an SMS OTP to a structurally valid Lebanese mobile number in sms_otp mode
      responses:
        '200':
          description: Generic delivery acknowledgement and cooldown
        '429':
          description: Cooldown, target, account, IP, or device limit reached
        '503':
          description: SMS verification provider unavailable
  /api/v1/auth/verification/phone/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Confirm mobile ownership and activate an eligible account
      responses:
        '200':
          description: Phone verified; completed signups must explicitly sign in
        '400':
          description: OTP invalid, expired, used, or replaced
  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '400':
          description: Validation failed
        '401':
          description: Invalid refresh token
        '403':
          description: Definitive inactive or unavailable account rejection
  /api/v1/auth/me:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Current authenticated profile
      responses:
        '200':
          description: Profile returned
        '401':
          description: Not authenticated
    put:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Update own non-contact profile fields
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation failed
        '401':
          description: Not authenticated
  /api/v1/auth/me/phone-change/request:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Re-authenticate and validate a replacement mobile number under the configured policy
      responses:
        '200':
          description: Format-only changes complete immediately; sms_otp deployments keep the existing phone until OTP confirmation
        '401':
          description: Current password is incorrect
        '409':
          description: The normalized mobile number is already used by the configured maximum number of accounts
  /api/v1/auth/me/phone-change/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Verify and atomically install the pending mobile number
      responses:
        '200':
          description: Mobile number changed and replacement access/refresh tokens returned
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Change own password
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation failed
        '401':
          description: Not authenticated or invalid current password
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout (client token disposal event)
      responses:
        '200':
          description: Logout acknowledged

  /api/v1/me/ai-validation-tasks:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI validation tasks for the current contributor
      description: Contributor-only endpoint. Returns open project validation tasks, tasks assigned to the authenticated contributor, and the contributor's submitted/reviewed validation evidence. Viewers and unassigned users are denied. These tasks validate AI predictions and are not official field data.
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AiPredictionValidationTaskStatus'
        - in: query
          name: ai_run_id
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Available and submitted AI validation tasks for the contributor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPredictionValidationTaskListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/projects:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: List projects accessible to current user
      responses:
        '200':
          description: Project list
        '401':
          description: Unauthorized
    post:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Create project (admin only)
      responses:
        '201':
          description: Project created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Get project by ID
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Update project (system admin or project admin)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Archive project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project archived
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/stats:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project statistics
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project statistics
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/features:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project features list
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project features
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/ai/readiness:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Check whether approved project data is ready for AI training
      description: Protected super-admin only. Read-only readiness probe. Does not run GEE, train models, classify, or write AI outputs.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: label_field
          schema:
            type: string
        - in: query
          name: min_samples_per_class
          schema:
            type: integer
            minimum: 1
        - in: query
          name: scope_type
          schema:
            type: string
            enum: [project, governorate, district, city, custom_polygon, national]
      responses:
        '200':
          description: AI readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReadinessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/published-layers:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List published AI layers for Project Map overlays
      description: Viewer-safe endpoint. Users with project access can see only AI output layers with published status when project AI is enabled. Technical storage paths and unpublished review layers are not exposed.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Published AI output layer list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/published-predictions:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List published AI prediction features for a project
      description: Viewer-safe endpoint backed by ai_prediction_feature. Returns the one published AI classification collection for the project map. Confidence is an attribute on each classification feature, not a separate map layer, and does not filter validation eligibility. AI predictions remain separate from spatial_feature until an admin approves/promotes a prediction.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: detail
          schema:
            type: string
            enum: [overview, full]
            default: overview
        - in: query
          name: geometry
          schema:
            type: string
            enum: [aggregate, simplified, full]
            default: aggregate
        - in: query
          name: bounds
          schema:
            type: string
          description: Optional viewport bounds as west,south,east,north.
        - in: query
          name: zoom
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2500
            default: 1800
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: class_label
          schema:
            type: string
        - in: query
          name: confidence_min
          schema:
            type: number
            minimum: 0
            maximum: 1
        - in: query
          name: confidence_max
          schema:
            type: number
            minimum: 0
            maximum: 1
        - in: query
          name: uncertainty_min
          schema:
            type: number
            minimum: 0
            maximum: 1
        - in: query
          name: uncertainty_max
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        '200':
          description: Published AI classification FeatureCollection payload from the database.
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/prediction-validation-tasks:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI prediction validation tasks for a project
      description: Admin-only endpoint. Lists validation tasks backed by ai_prediction_feature rows. Assignment is optional; open tasks are available to project contributors. These tasks are not official field data and never approve or insert spatial_feature rows.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AiPredictionValidationTaskStatus'
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
        - in: query
          name: ai_run_id
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Project AI prediction validation task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPredictionValidationTaskListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/prediction-validation-tasks/generate:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Generate AI prediction validation tasks
      description: Legacy admin-only task endpoint. Creates open validation tasks from classification ai_prediction_feature rows. Confidence is metadata, generation is idempotent for active tasks, and the task workflow does not write to spatial_feature.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiPredictionValidationGenerateRequest'
      responses:
        '201':
          description: AI prediction validation tasks generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPredictionValidationGenerateResponse'
        '400':
          description: Invalid generation request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project or selected AI layer not found
  /api/v1/projects/{projectId}/ai/settings:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get project AI settings
      description: Protected super-admin only.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: AI settings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    put:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Save project AI settings
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProjectSettingsRequest'
      responses:
        '200':
          description: AI settings saved
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    patch:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Patch project AI settings
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProjectSettingsRequest'
      responses:
        '200':
          description: AI settings saved
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/runs:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List project AI runs
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                draft,
                queued,
                extracting_features,
                training,
                evaluating,
                classifying,
                ready_for_review,
                published,
                failed,
                cancelled,
              ]
      responses:
        '200':
          description: AI run list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Create a draft or queued AI run record
      description: Creates an ai_run row and ai_run_log entry. A queued run is processed only when the backend AI worker command is running. Regional execution modes can run the controlled project-area pipeline and register review artifacts; national classification, publishing, Redis-backed queueing, and spatial_feature insertion are not started.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRunCreateRequest'
      responses:
        '201':
          description: AI run record created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Readiness blockers prevent queueing
  /api/v1/projects/{projectId}/ai/runs/{runId}/publish:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Publish a completed AI run classification layer
      description: Admin endpoint. Publishes the run's classification ai_output_layer for project-map visibility and contributor validation. Publishing does not promote predictions into spatial_feature; promotion happens only after admin review approval.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run classification layer published
        '400':
          description: Run is not publishable
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project, run, or layer not found
        '409':
          description: Project AI is disabled or predictions are unavailable
  /api/v1/projects/{projectId}/ai/runs/{runId}/unpublish:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Unpublish a project AI run classification layer
      description: Admin endpoint. Removes contributor validation visibility for the published classification layer without deleting predictions or promoted spatial features.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run classification layer unpublished
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project, run, or layer not found
        '409':
          description: Run is not published
  /api/v1/projects/{projectId}/ai/runs/{runId}/validation-summary:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get run-level AI prediction validation summary
      description: Counts all classification prediction features for the run regardless of confidence, plus contributor-validation and admin-review totals.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run validation summary
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project or run not found
  /api/v1/projects/{projectId}/ai/runs/{runId}/validations:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List contributor validations for an AI run
      description: Admin endpoint. Lists contributor validation submissions for classification predictions in the run.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: AI run contributor validation list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project or run not found
  /api/v1/projects/{projectId}/ai/runs/{runId}/predictions/{predictionId}:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get one AI prediction feature with validation state
      description: Returns the classification prediction, confidence attribute, contributor validation summary, the current user's validation if any, and admin-review state.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/predictionId'
      responses:
        '200':
          description: AI prediction feature details
        '401':
          description: Unauthorized
        '403':
          description: Prediction is unpublished or user lacks access
        '404':
          description: Prediction not found
  /api/v1/projects/{projectId}/ai/predictions/{predictionId}/validations:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Submit contributor validation for an AI prediction feature
      description: Assigned contributors only. Each contributor can validate a published AI prediction once; many contributors can validate the same prediction.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - $ref: '#/components/parameters/predictionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [validation_result]
              properties:
                validation_result:
                  type: string
                  enum: [correct, incorrect, unsure, cannot_verify]
                corrected_class:
                  type: string
                  nullable: true
                note:
                  type: string
                  nullable: true
                photo_media_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                gps_location:
                  type: object
                  nullable: true
                gps_accuracy_m:
                  type: number
                  nullable: true
      responses:
        '201':
          description: Contributor validation saved
        '400':
          description: Invalid validation payload
        '401':
          description: Unauthorized
        '403':
          description: User is not an assigned contributor or layer is unpublished
        '404':
          description: Prediction not found
        '409':
          description: Contributor already validated this feature or validation is closed
    get:
      tags: [AI]
      security:
        - bearerAuth: []
