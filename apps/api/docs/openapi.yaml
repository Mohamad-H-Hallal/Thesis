components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste a valid TerraLeb access token. Swagger UI adds the Bearer prefix.
    aiCallbackSecret:
      type: apiKey
      in: header
      name: x-ai-callback-secret
      description: Service-to-service callback credential used only by the trusted AI server.
    metricsToken:
      type: http
      scheme: bearer
      description: Operational metrics token when METRICS_TOKEN is configured.
  parameters:
    projectId:
      in: path
      name: projectId
      required: true
      schema:
        type: string
        format: uuid
    featureId:
      in: path
      name: featureId
      required: true
      schema:
        type: string
        format: uuid
    assignmentId:
      in: path
      name: assignmentId
      required: true
      schema:
        type: string
        format: uuid
    photoId:
      in: path
      name: photoId
      required: true
      schema:
        type: string
        format: uuid
    categoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    notificationId:
      in: path
      name: notificationId
      required: true
      schema:
        type: string
        format: uuid
    exportId:
      in: path
      name: exportId
      required: true
      schema:
        type: string
        format: uuid
    importId:
      in: path
      name: importId
      required: true
      schema:
        type: string
        format: uuid
    userId:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid
    runId:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid
    layerId:
      in: path
      name: layerId
      required: true
      schema:
        type: string
        format: uuid
    predictionId:
      in: path
      name: predictionId
      required: true
      schema:
        type: string
        format: uuid
    taskId:
      in: path
      name: taskId
      required: true
      schema:
        type: string
        format: uuid
    privacyRequestId:
      in: path
      name: requestId
      required: true
      schema:
        type: string
        format: uuid
    contentReportId:
      in: path
      name: reportId
      required: true
      schema:
        type: string
        format: uuid
    tileZ:
      in: path
      name: z
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 22
    tileX:
      in: path
      name: x
      required: true
      schema:
        type: integer
        minimum: 0
    tileY:
      in: path
      name: y
      required: true
      schema:
        type: integer
        minimum: 0
    minLon:
      in: query
      name: minLon
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    minLat:
      in: query
      name: minLat
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    maxLon:
      in: query
      name: maxLon
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    maxLat:
      in: query
      name: maxLat
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
    storageName:
      in: path
      name: storageName
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F-]+\.(?:jpe?g|png|gif|hei[cf]s?)$'
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, full_name, phone, role]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
        full_name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [contributor, viewer]
        legal_acceptances:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: '#/components/schemas/LegalAcceptance'
    LegalAcceptance:
      type: object
      required: [document_type, version, locale, affirmative]
      properties:
        document_type:
          type: string
          enum: [terms, acceptable_use]
        version:
          type: string
        locale:
          type: string
          example: en
        affirmative:
          type: boolean
          enum: [true]
    PrivacyRequestInput:
      type: object
      required: [request_type]
      properties:
        request_type:
          type: string
          enum: [access_export, correction, deletion, restriction, objection]
        current_password:
          type: string
          writeOnly: true
          description: Required for deletion and access/export requests
        details:
          type: object
          additionalProperties: true
    AccountDeletionEligibility:
      type: object
      required: [can_request, operationally_eligible, protected_account, role, blockers, manual_review_required, notice]
      properties:
        can_request:
          type: boolean
        operationally_eligible:
          type: boolean
          description: Whether the user's current role-specific operational blockers are resolved; this is not confirmation that the reviewed deletion has completed.
        protected_account:
          type: boolean
        role:
          type: string
          enum: [admin, contributor, viewer]
        blockers:
          type: array
          items:
            type: object
            required: [code, count, message]
            properties:
              code:
                type: string
                enum: [ACTIVE_PROJECT_ASSIGNMENTS, PENDING_CONTRIBUTION_REVIEWS]
              count:
                type: integer
                minimum: 1
              message:
                type: string
        manual_review_required:
          type: boolean
          enum: [true]
        notice:
          type: string
    AiGovernanceRequest:
      type: object
      required: [training_data_use_authorized, publication_authorized]
      properties:
        training_data_use_authorized:
          type: boolean
        training_authority_basis:
          type: string
          maxLength: 2000
          nullable: true
        training_approval_reference:
          type: string
          maxLength: 500
          nullable: true
        publication_authorized:
          type: boolean
        publication_authority_basis:
          type: string
          maxLength: 2000
          nullable: true
        publication_approval_reference:
          type: string
          maxLength: 500
          nullable: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
    PasswordResetEmailRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    VerifyResetOtpRequest:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          pattern: '^\d{6}$'
          writeOnly: true
    ResetPasswordRequest:
      type: object
      required: [reset_token, new_password]
      properties:
        reset_token:
          type: string
          writeOnly: true
        new_password:
          type: string
          minLength: 8
          writeOnly: true
    ImportCommentRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 4000
        feature_id:
          type: string
          format: uuid
          nullable: true
    ImportSourceProvenance:
      type: object
      required:
        - source_provider
        - source_dataset_name
        - source_license_or_authority
        - source_redistribution_rules
        - provenance_confirmed
      properties:
        source_provider:
          type: string
          minLength: 1
          maxLength: 240
        source_dataset_name:
          type: string
          minLength: 1
          maxLength: 240
        source_dataset_date:
          type: string
          format: date
          nullable: true
        source_accuracy_statement:
          type: string
          maxLength: 1000
          nullable: true
        source_license_or_authority:
          type: string
          minLength: 1
          maxLength: 1000
        source_attribution:
          type: string
          maxLength: 1000
          nullable: true
        source_terms_url:
          type: string
          format: uri
          maxLength: 2048
          nullable: true
        source_redistribution_rules:
          type: string
          minLength: 1
          maxLength: 1000
        provenance_confirmed:
          type: boolean
          enum: [true]
    PushDeviceRegistrationRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
        platform:
          type: string
          enum: [android, ios]
        device_label:
          type: string
          maxLength: 120
        app_version:
          type: string
          maxLength: 60
        show_sensitive_preview:
          type: boolean
          default: false
          description: Explicit per-device opt-in to detailed lock-screen content
    PushDeviceUnregistrationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 4096
          writeOnly: true
    SupportSettingsRequest:
      type: object
      properties:
        support_email:
          type: string
          format: email
          nullable: true
        support_phone:
          type: string
          nullable: true
          description: Lebanese mobile number; normalized to E.164 by the API.
        office_hours:
          type: string
          nullable: true
        help_text:
          type: string
          nullable: true
    CreateAdminRequest:
      type: object
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          writeOnly: true
        full_name:
          type: string
          minLength: 1
        phone:
          type: string
          nullable: true
    ToggleAdminRoleRequest:
      type: object
      properties:
        force_unassign:
          type: boolean
          default: false
    AiRunCallbackRequest:
      type: object
      properties:
        run_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [accepted, created, starting, running, completed, failed, cancelling, cancelled, paused, queued]
        stage:
          type: string
          nullable: true
        progress:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        message:
          type: string
          nullable: true
        metrics:
          type: object
        artifacts:
          type: object
        counts:
          type: object
        settings:
          type: object
        error:
          nullable: true
        dry_run:
          type: boolean
        callback_secret:
          type: string
          writeOnly: true
          deprecated: true
          description: Legacy body fallback. Prefer the x-ai-callback-secret header.
    AiProjectSettingsRequest:
      type: object
      properties:
        is_enabled:
          type: boolean
        label_field:
          type: string
          nullable: true
        scope_type:
          type: string
          enum: [project, governorate, district, city, custom_polygon, national]
        scope_geometry:
          type: object
          nullable: true
          description: GeoJSON Polygon, MultiPolygon, or GeometryCollection for custom scope.
        min_samples_per_class:
          type: integer
          minimum: 1
        model_preferences:
          type: object
    AiRunCreateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [draft, queued]
          default: draft
        label_field:
          type: string
        scope_type:
          type: string
          enum: [project, governorate, district, city, custom_polygon, national]
        scope_geometry:
          type: object
          nullable: true
        region_preset:
          type: string
          nullable: true
        min_samples_per_class:
          type: integer
          minimum: 1
        execution_mode:
          type: string
          enum:
            - mock
            - dry_run
            - local_ground_truth_export
            - regional_feature_extraction
            - regional_model_eval
            - regional_classification
            - regional_vectorization_artifacts
            - regional_full_review_artifacts
          default: mock
          description: Safe worker mode. regional_full_review_artifacts runs the controlled project-area sequence for ground-truth export, feature extraction, model evaluation, regional review predictions, and vector review artifacts. National classification, viewer publishing, spatial_feature insertion, and Redis-backed queueing remain unavailable.
    AiRunReviewRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum:
            - approve_for_publication
            - reject
            - request_more_data
            - keep_draft
          description: Review action for protected super-admins. Approving prepares results for a later publishing phase; it does not publish to viewers.
        reason:
          type: string
          nullable: true
          maxLength: 4000
          description: Required for reject and request_more_data.
    AiPredictionValidationTaskStatus:
      type: string
      enum: [open, assigned, in_progress, submitted, accepted, rejected, cancelled]
    AiPredictionValidationGenerateRequest:
      type: object
      properties:
        ai_run_id:
          type: string
          format: uuid
          nullable: true
        ai_output_layer_id:
          type: string
          format: uuid
          nullable: true
        ai_prediction_feature_id:
          type: string
          format: uuid
          nullable: true
          description: Manual task creation for one AI prediction feature.
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        limit:
          type: integer
          minimum: 1
          maximum: 10000
          nullable: true
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          nullable: true
    AiPredictionValidationGenerateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            created_count:
              type: integer
            candidate_count:
              type: integer
            existing_active_count:
              type: integer
            threshold:
              type: number
            threshold_source:
              type: string
            candidate_layer_type:
              type: string
              enum: [classification, confidence, uncertainty]
            criterion:
              type: string
            task_ids:
              type: array
              items:
                type: string
                format: uuid
            no_spatial_feature_writes:
              type: boolean
    AiPredictionValidationAssignRequest:
      type: object
      required: [assigned_to]
      properties:
        assigned_to:
          type: string
          format: uuid
    AiPredictionValidationStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AiPredictionValidationTaskStatus'
    AiPredictionValidationSubmissionRequest:
      type: object
      required: [result, note]
      properties:
        result:
          type: string
          enum: [correct, wrong_class, not_target_class, unsure]
        corrected_class:
          type: string
          nullable: true
          description: Required when result is wrong_class. Must be a trained/eligible class for the AI run.
        note:
          type: string
          maxLength: 4000
        evidence:
          type: object
          additionalProperties: true
          description: Evidence metadata. Photo upload is intentionally left to later UI phases.
        linked_feature_id:
          type: string
          format: uuid
          nullable: true
          description: Optional draft or pending spatial_feature created through the normal workflow. Never auto-approved.
    AiPredictionValidationReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [accepted, rejected]
        reason:
          type: string
          nullable: true
          maxLength: 4000
          description: Required when decision is rejected.
        submission_id:
          type: string
          format: uuid
          nullable: true
    AiPredictionValidationTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        ai_run_id:
          type: string
          format: uuid
        ai_prediction_feature_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AiPredictionValidationTaskStatus'
        assigned_to:
          type: string
          format: uuid
          nullable: true
        review_decision:
          type: string
          enum: [accepted, rejected]
          nullable: true
        review_reason:
          type: string
          nullable: true
        priority:
          type: integer
        prediction:
          type: object
          properties:
            id:
              type: string
              format: uuid
            artifact_feature_id:
              type: string
            geometry:
              type: object
              nullable: true
            predicted_class:
              type: string
              nullable: true
            confidence:
              type: number
              nullable: true
            uncertainty_score:
              type: number
              nullable: true
            model_name:
              type: string
              nullable: true
            source:
              type: string
              enum: [ai_prediction]
            not_official_field_data:
              type: boolean
        latest_submission:
          type: object
          nullable: true
        not_official_field_data:
          type: boolean
        no_spatial_feature_writes:
          type: boolean
    AiPredictionValidationTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/AiPredictionValidationTask'
    AiPredictionValidationTaskListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/AiPredictionValidationTask'
            status_counts:
              type: object
              additionalProperties:
                type: integer
            no_spatial_feature_writes:
              type: boolean
            not_official_field_data:
              type: boolean
        pagination:
          type: object
    AiReadinessResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            project:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
            settings:
              type: object
            readiness:
              type: object
              properties:
                status:
                  type: string
                  enum: [ready, warning, not_ready]
                label_field:
                  type: string
                  nullable: true
                approved_feature_count:
                  type: integer
                labeled_feature_count:
                  type: integer
                  description: Approved features with valid geometry and a non-empty selected label.
                eligible_feature_count:
                  type: integer
                  description: Samples in classes that meet the configured minimum sample threshold.
                missing_label_count:
                  type: integer
                invalid_geometry_count:
                  type: integer
                excluded_feature_count:
                  type: integer
                  description: Approved features excluded because of missing labels, invalid geometry, or low-count classes.
                eligible_class_count:
                  type: integer
                  description: Number of classes that meet the configured minimum sample threshold.
                label_counts:
                  type: array
                  items:
                    type: object
                classes_below_minimum:
                  type: array
                  items:
                    type: object
                candidate_label_fields:
                  type: array
                  description: Label-field candidates derived from project schema, approved feature attributes, and current AI settings.
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                      source:
                        type: array
                        items:
                          type: string
                      labeled_feature_count:
                        type: integer
                      class_count:
                        type: integer
                      usable:
                        type: boolean
                      classifier_candidate:
                        type: boolean
                        description: Whether the field passed classifier-field heuristics before alias filtering.
                      selectable:
                        type: boolean
                        description: Whether the field should appear as a primary classifier choice.
                      diagnostic_only:
                        type: boolean
                        description: True for aliases or fields without usable labels.
                      alias_of:
                        type: string
                        nullable: true
                        description: Primary classifier field when this candidate is an equivalent alias.
                      aliases:
                        type: array
                        items:
                          type: string
                        description: Equivalent fields mapped to this primary classifier field.
                      hidden_reason:
                        type: string
                        nullable: true
                        description: Reason the field is diagnostic-only when it is not selectable.
                      recommended:
                        type: boolean
                      note:
                        type: string
                source_counts:
                  type: array
                  items:
                    type: object
                national_scope_enabled:
                  type: boolean
                  description: True only after backend eligibility passes and national mode has been explicitly enabled.
                national_scope_eligibility:
                  type: object
                  properties:
                    eligible:
                      type: boolean
                    requirements:
                      type: array
                      items:
                        type: object
                        required: [key, label, passed, message]
                        properties:
                          key:
                            type: string
                          label:
                            type: string
                          passed:
                            type: boolean
                          current_value:
                            nullable: true
                            oneOf:
                              - type: string
                              - type: number
                              - type: boolean
                          required_value:
                            nullable: true
                            oneOf:
                              - type: string
                              - type: number
                              - type: boolean
                          message:
                            type: string
                    unmet_requirements:
                      type: array
                      items:
                        type: string
                    warnings:
                      type: array
                      items:
                        type: string
                warnings:
                  type: array
                  items:
                    type: string
                blockers:
                  type: array
                  items:
                    type: string
