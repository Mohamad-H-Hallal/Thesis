openapi: 3.0.3
info:
  title: TerraLeb API
  version: 1.2.0
  description: >
    Government field data collection API for projects, assignments, geospatial features,
    exports, notifications, and administration.
servers:
  - url: /
    description: Current TerraLeb API host (same origin as Swagger UI)
tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: AI
  - name: Features
  - name: Assignments
  - name: Photos
  - name: Categories
  - name: Notifications
  - name: Exports
  - name: Imports
  - name: Offline / Sync
  - name: Settings
  - name: Users
  - name: Legal
  - name: Privacy
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      responses:
        '200':
          description: Service is live
  /ready:
    get:
      tags: [System]
      summary: Readiness check (database)
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      tags: [System]
      security:
        - metricsToken: []
      summary: Metrics snapshot (token protected in production)
      responses:
        '200':
          description: Metrics payload
        '401':
          description: Unauthorized
  /api/v1:
    get:
      tags: [System]
      summary: API metadata
      responses:
        '200':
          description: Metadata response

  /legal:
    get:
      tags: [Legal]
      summary: Public legal document index
      security: []
      responses:
        '200':
          description: Stable public index of approved documents, or marked drafts outside production
          content:
            text/html:
              schema:
                type: string
        '503':
          description: No approved production documents are available
  /legal/{slug}:
    get:
      tags: [Legal]
      summary: Public versioned legal document page
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
            enum: [privacy, terms, acceptable-use, important-notices, account-deletion, subprocessors, open-source]
      responses:
        '200':
          description: Approved document, or clearly marked non-production draft outside production
          content:
            text/html:
              schema:
                type: string
        '503':
          description: No approved production document is available
  /legal/account-deletion/request:
    get:
      tags: [Legal]
      summary: Public non-enumerating account-deletion request form
      security: []
      responses:
        '200':
          description: Accessible account-deletion request form
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request rate limited
    post:
      tags: [Legal]
      summary: Submit a public deletion request for identity verification
      description: Always returns the same acknowledgement whether or not the supplied account exists.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 320
      responses:
        '202':
          description: Generic non-enumerating acknowledgement
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Request rate limited
  /api/v1/legal/documents:
    get:
      tags: [Legal]
      summary: List current legal documents and mandatory acceptance types
      security: []
      responses:
        '200':
          description: Versioned documents with content digests and approval state
        '503':
          description: Approved production documents are unavailable
  /api/v1/legal/documents/{slug}:
    get:
      tags: [Legal]
      summary: Retrieve the current document by stable slug
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Versioned document with exact content digest
        '503':
          description: Approved production document unavailable
  /api/v1/legal/documents/{slug}/versions/{version}:
    get:
      tags: [Legal]
      summary: Retrieve a specific published document version
      security: []
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
        - in: path
          name: version
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exact document version
        '503':
          description: Approved production document unavailable
  /api/v1/legal/acceptance/status:
    get:
      tags: [Legal]
      security:
        - bearerAuth: []
      summary: Check whether the current mandatory documents were accepted
      responses:
        '200':
          description: Current and missing acceptance versions
  /api/v1/legal/acceptance:
    post:
      tags: [Legal]
      security:
        - bearerAuth: []
      summary: Affirmatively accept current Terms and Acceptable Use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptances]
              properties:
                acceptances:
                  type: array
                  minItems: 2
                  items:
                    $ref: '#/components/schemas/LegalAcceptance'
      responses:
        '201':
          description: Exact document versions recorded
        '422':
          description: Missing, obsolete, non-affirmative, or bundled privacy consent

  /api/v1/privacy/account-deletion/eligibility:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Check role-specific operational conditions for account deletion
      description: The protected super administrator cannot initiate deletion. Contributors may initiate a request at any time, but completion waits until project assignments and pending contribution reviews are resolved.
      responses:
        '200':
          description: Current deletion-request and operational-eligibility state
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/AccountDeletionEligibility'
  /api/v1/privacy/requests:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: List only the current user's privacy requests
      responses:
        '200':
          description: User-scoped request list
    post:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Initiate access/export, correction, deletion, restriction, or objection request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacyRequestInput'
      responses:
        '201':
          description: Verified request created; deletion does not deactivate the account
        '403':
          description: Reauthentication failed
        '409':
          description: An equivalent open request already exists
  /api/v1/privacy/requests/{requestId}/cancel:
    post:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Cancel the current user's eligible open request
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request cancelled
        '409':
          description: Request is not owned by the user or cannot be cancelled
  /api/v1/privacy/requests/{requestId}:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Get one privacy request owned by the current user
      parameters:
        - $ref: '#/components/parameters/privacyRequestId'
      responses:
        '200':
          description: User-safe request status and execution metadata
        '404':
          description: Request not found for the current user
  /api/v1/privacy/requests/{requestId}/export-grant:
    post:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Reauthenticate and create a session-bound single-use export grant
      parameters:
        - $ref: '#/components/parameters/privacyRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password:
                  type: string
                  format: password
      responses:
        '201':
          description: Short-lived download grant created
        '403':
          description: Reauthentication failed
        '409':
          description: Export artifact is not ready
  /api/v1/privacy/exports/{artifactId}/download:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Download and consume an authenticated encrypted-export grant
      parameters:
        - in: path
          name: artifactId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: X-Privacy-Export-Grant
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Decrypted user-isolated personal-data report. New reports are self-contained HTML; older retained artifacts may remain JSON.
          content:
            text/html:
              schema:
                type: string
            application/json:
              schema:
                type: object
        '403':
          description: Grant invalid, expired, consumed, wrong-session, or wrong-user
        '410':
          description: Artifact expired or deleted
  /api/v1/privacy/admin/requests:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Protected privacy-request queue
      responses:
        '200':
          description: Deadline-ordered privacy queue
        '403':
          description: Protected super-admin required
  /api/v1/privacy/admin/requests/{requestId}:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Get protected request details and status history
      parameters:
        - $ref: '#/components/parameters/privacyRequestId'
      responses:
        '200':
          description: Protected request detail
        '403':
          description: Protected super-admin required
        '404':
          description: Request not found
    patch:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Update a privacy-request review state
      description: Correction applies through the profile service. Access export and deletion schedule background execution and cannot be manually marked completed.
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Review state updated
        '409':
          description: Completion is blocked or the request is closed
  /api/v1/privacy/admin/requests/{requestId}/retry:
    post:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Retry a failed access-export or deletion workload after remediation
      parameters:
        - $ref: '#/components/parameters/privacyRequestId'
      responses:
        '202':
          description: Failed execution rescheduled
        '403':
          description: Protected super-admin required
        '409':
          description: Request is not eligible for retry
  /api/v1/privacy/admin/queue-counts:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Get low-cardinality protected privacy and moderation queue counts
      responses:
        '200':
          description: Open and overdue counts for both queues
        '403':
          description: Protected super-admin required
  /api/v1/privacy/content-reports:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: List only the current user's submitted content reports
      responses:
        '200':
          description: Reporter-safe report status list
    post:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Report authorized project content for privacy, safety, accuracy, or license review
      responses:
        '201':
          description: Moderation report created
        '403':
          description: Caller lacks project access
  /api/v1/privacy/admin/content-reports:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Protected moderation and takedown queue
      responses:
        '200':
          description: Moderation queue
        '403':
          description: Protected super-admin required
  /api/v1/privacy/admin/content-reports/{reportId}:
    get:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Get protected content-report detail and status history
      parameters:
        - $ref: '#/components/parameters/contentReportId'
      responses:
        '200':
          description: Protected report detail
        '403':
          description: Protected super-admin required
        '404':
          description: Report not found
    patch:
      tags: [Privacy]
      security:
        - bearerAuth: []
      summary: Review or resolve a content report with an auditable reporter message
      parameters:
        - $ref: '#/components/parameters/contentReportId'
      responses:
        '200':
          description: Moderation state updated
        '409':
          description: Report is already final or was not found

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register public user (contributor/viewer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Pending user created with a limited verification-session token; no full-access JWT is issued
        '400':
          description: Validation failed
        '409':
          description: Email already exists, or the normalized mobile number is already used by three accounts
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation failed
        '401':
          description: Invalid credentials
        '403':
          description: Contact verification or account approval is still required
        '429':
          description: Rate limited
  /api/v1/auth/verification/status:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Resume a limited contact-verification session
      responses:
        '200':
          description: Masked destinations and required next step
        '401':
          description: Verification session invalid, expired, or replaced
  /api/v1/auth/verification/email/send:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Send or resend the signup/invitation email verification code
      responses:
        '200':
          description: Generic delivery acknowledgement and cooldown
        '429':
          description: Cooldown, target, account, IP, or device limit reached
  /api/v1/auth/verification/email/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Confirm email ownership with a single-use code
      responses:
        '200':
          description: Email verified; completed signups must explicitly sign in, while sms_otp deployments continue to phone ownership verification
        '400':
          description: Code invalid, expired, used, or replaced
  /api/v1/auth/verification/pending-signup:
    delete:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Remove the caller's unfinished, unverified self-signup
      description: Requires the limited verification-session token. Verified, invited, admin, and legacy accounts cannot be deleted through this endpoint.
      responses:
        '200':
          description: Pending user and active verification challenges removed
        '409':
          description: Account is not eligible for pending-signup cancellation
  /api/v1/auth/verification/phone/validate:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Validate and normalize a Lebanese mobile number under the configured format policy
      description: Available only in format_only mode. The default provider uses maintained local libphonenumber metadata without a network account. This endpoint does not send an SMS and does not prove possession, assignment, or reachability.
      responses:
        '200':
          description: Format assurance recorded separately from ownership verification; completed signups must explicitly sign in
        '400':
          description: Number is not a structurally valid Lebanese mobile number
        '409':
          description: SMS ownership verification is required by the configured policy
        '429':
          description: Cooldown, target, account, IP, or device limit reached
        '503':
          description: Configured external format provider unavailable
  /api/v1/auth/verification/phone/send:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Send an SMS OTP to a structurally valid Lebanese mobile number in sms_otp mode
      responses:
        '200':
          description: Generic delivery acknowledgement and cooldown
        '429':
          description: Cooldown, target, account, IP, or device limit reached
        '503':
          description: SMS verification provider unavailable
  /api/v1/auth/verification/phone/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Confirm mobile ownership and activate an eligible account
      responses:
        '200':
          description: Phone verified; completed signups must explicitly sign in
        '400':
          description: OTP invalid, expired, used, or replaced
  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Rotate a single-use refresh token and renew the authenticated session
      description: A successful request invalidates the presented refresh token. Replaying an already-rotated token revokes the affected account sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Access and refresh tokens rotated successfully
        '400':
          description: Validation failed
        '401':
          description: Invalid refresh token
        '403':
          description: Definitive inactive or unavailable account rejection
  /api/v1/auth/me:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Current authenticated profile
      responses:
        '200':
          description: Profile returned
        '401':
          description: Not authenticated
    put:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Update own non-contact profile fields
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation failed
        '401':
          description: Not authenticated
  /api/v1/auth/me/phone-change/request:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Re-authenticate and validate a replacement mobile number under the configured policy
      responses:
        '200':
          description: Format-only changes complete immediately; sms_otp deployments keep the existing phone until OTP confirmation
        '401':
          description: Current password is incorrect
        '409':
          description: The normalized mobile number is already used by the configured maximum number of accounts
  /api/v1/auth/me/phone-change/confirm:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Verify and atomically install the pending mobile number
      responses:
        '200':
          description: Mobile number changed and replacement access/refresh tokens returned
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Change own password
      description: Revokes every other authenticated session and returns replacement credentials for the current device.
      responses:
        '200':
          description: Password changed and current-session credentials rotated
        '400':
          description: Validation failed
        '401':
          description: Not authenticated or invalid current password
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout and revoke the current server-side session
      responses:
        '200':
          description: Logout acknowledged

  /api/v1/me/ai-validation-tasks:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI validation tasks for the current contributor
      description: Contributor-only endpoint. Returns open project validation tasks, tasks assigned to the authenticated contributor, and the contributor's submitted/reviewed validation evidence. Viewers and unassigned users are denied. These tasks validate AI predictions and are not official field data.
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/AiPredictionValidationTaskStatus'
        - in: query
          name: ai_run_id
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Available and submitted AI validation tasks for the contributor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPredictionValidationTaskListResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /api/v1/projects:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: List projects accessible to current user
      responses:
        '200':
          description: Project list
        '401':
          description: Unauthorized
    post:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Create project (admin only)
      responses:
        '201':
          description: Project created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Get project by ID
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Update project (system admin or project admin)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Archive project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project archived
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/stats:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project statistics
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project statistics
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/features:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project features list
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project features
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/ai/readiness:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Check whether approved project data is ready for AI training
      description: Protected super-admin only. Read-only readiness probe. Does not run GEE, train models, classify, or write AI outputs.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: label_field
          schema:
            type: string
        - in: query
          name: min_samples_per_class
          schema:
            type: integer
            minimum: 1
        - in: query
          name: scope_type
          schema:
            type: string
            enum: [project, governorate, district, city, custom_polygon, national]
      responses:
        '200':
          description: AI readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReadinessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/published-layers:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List published AI layers for Project Map overlays
      description: Viewer-safe endpoint. Users with project access can see only AI output layers with published status when project AI is enabled. Technical storage paths and unpublished review layers are not exposed.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Published AI output layer list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/published-predictions:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List published AI prediction features for a project
      description: Viewer-safe endpoint backed by ai_prediction_feature. Returns the one published AI classification collection for the project map. Confidence is an attribute on each classification feature, not a separate map layer, and does not filter validation eligibility. AI predictions remain separate from spatial_feature until an admin approves/promotes a prediction.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: detail
          schema:
            type: string
            enum: [overview, full]
            default: overview
        - in: query
          name: geometry
          schema:
            type: string
            enum: [aggregate, simplified, full]
            default: aggregate
        - in: query
          name: bounds
          schema:
            type: string
          description: Optional viewport bounds as west,south,east,north.
        - in: query
          name: zoom
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2500
            default: 1800
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: class_label
