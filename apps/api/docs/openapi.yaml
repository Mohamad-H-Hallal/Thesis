openapi: 3.0.3
info:
  title: Lebanese GIS Mobile Application API
  version: 1.1.0
  description: >
    Government field data collection API for projects, assignments, geospatial features,
    exports, notifications, and administration.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development (primary)
  - url: http://localhost:3000/api
    description: Legacy compatibility prefix (optional)
tags:
  - name: System
  - name: Auth
  - name: Projects
  - name: AI
  - name: Features
  - name: Assignments
  - name: Photos
  - name: Categories
  - name: Notifications
  - name: Exports
  - name: Imports
  - name: Users
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check
      responses:
        '200':
          description: Service is live
  /ready:
    get:
      tags: [System]
      summary: Readiness check (database)
      responses:
        '200':
          description: Service is ready
        '503':
          description: Service is not ready
  /metrics:
    get:
      tags: [System]
      summary: Metrics snapshot (token protected in production)
      responses:
        '200':
          description: Metrics payload
        '401':
          description: Unauthorized
  /api/v1:
    get:
      tags: [System]
      summary: API metadata
      responses:
        '200':
          description: Metadata response

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register public user (contributor/viewer only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
        '400':
          description: Validation failed
        '409':
          description: Email already exists
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive access/refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation failed
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /api/v1/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
        '400':
          description: Validation failed
        '401':
          description: Invalid refresh token
  /api/v1/auth/me:
    get:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Current authenticated profile
      responses:
        '200':
          description: Profile returned
        '401':
          description: Not authenticated
    put:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Update own profile
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation failed
        '401':
          description: Not authenticated
  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Change own password
      responses:
        '200':
          description: Password changed
        '400':
          description: Validation failed
        '401':
          description: Not authenticated or invalid current password
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout (client token disposal event)
      responses:
        '200':
          description: Logout acknowledged

  /api/v1/projects:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: List projects accessible to current user
      responses:
        '200':
          description: Project list
        '401':
          description: Unauthorized
    post:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Create project (admin only)
      responses:
        '201':
          description: Project created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Get project by ID
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project found
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Update project (system admin or project admin)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project updated
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    delete:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Archive project
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project archived
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/stats:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project statistics
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project statistics
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/features:
    get:
      tags: [Projects]
      security:
        - bearerAuth: []
      summary: Project features list
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Project features
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v1/projects/{projectId}/ai/readiness:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Check whether approved project data is ready for AI training
      description: Protected super-admin only. Read-only readiness probe. Does not run GEE, train models, classify, or write AI outputs.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: label_field
          schema:
            type: string
        - in: query
          name: min_samples_per_class
          schema:
            type: integer
            minimum: 1
        - in: query
          name: scope_type
          schema:
            type: string
            enum: [project, governorate, district, city, custom_polygon, national]
      responses:
        '200':
          description: AI readiness result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReadinessResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/published-layers:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List published AI layers for Project Map overlays
      description: Viewer-safe endpoint. Users with project access can see only AI output layers with published status when project AI is enabled. Technical storage paths and unpublished review layers are not exposed.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: Published AI output layer list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/uncertainty-areas:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List project AI uncertainty validation tasks
      description: Admin and protected super-admin management endpoint. Returns uncertainty tasks registered from AI artifacts. It does not expose or approve field data and never inserts AI predictions into spatial_feature.
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: status
          schema:
            type: string
            enum: [open, assigned, in_progress, in_review, validated, rejected, cancelled, dismissed]
        - in: query
          name: assigned_to
          schema:
            type: string
            format: uuid
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: AI uncertainty validation task list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/settings:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get project AI settings
      description: Protected super-admin only.
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: AI settings
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    put:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Save project AI settings
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProjectSettingsRequest'
      responses:
        '200':
          description: AI settings saved
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    patch:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Patch project AI settings
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProjectSettingsRequest'
      responses:
        '200':
          description: AI settings saved
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v1/projects/{projectId}/ai/runs:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List project AI runs
      parameters:
        - $ref: '#/components/parameters/projectId'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                draft,
                queued,
                extracting_features,
                training,
                evaluating,
                classifying,
                ready_for_review,
                published,
                failed,
                cancelled,
              ]
      responses:
        '200':
          description: AI run list
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Create a draft or queued AI run record without worker execution
      description: Creates only an ai_run row and ai_run_log entry. Phase F execution modes are limited to mock, dry-run, local-only ground-truth export, regional feature extraction, or regional model evaluation. National classification, publishing, and DB output insertion are not started.
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRunCreateRequest'
      responses:
        '201':
          description: AI run record created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '422':
          description: Readiness blockers prevent queueing
  /api/v1/ai/runs/{runId}:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get AI run detail
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/metrics:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI run metrics
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI metric list
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/layers:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI output layer metadata
      description: Protected super-admin only. Returns reviewable AI layer metadata. AI outputs are never inserted into spatial_feature.
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI output layer list
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/me/ai-validation-tasks:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List my assigned AI validation tasks
      description: Contributor-only endpoint. Returns only AI uncertainty validation tasks assigned to the authenticated contributor. Viewers and admins are denied from this personal task queue.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, assigned, in_progress, in_review, validated, rejected, cancelled, dismissed]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Assigned AI validation task list
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/ai/layers/{layerId}/features:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Preview registered AI layer GeoJSON features
      description: Protected super-admin can preview unpublished review layers. Other project users can fetch features only for published AI layers. Reads only registered artifact paths under the configured AI outputs directory, never inserts AI predictions into spatial_feature, and includes whole-layer totals, visible viewport counts, returned counts, and cap metadata so clients do not confuse an optimized preview with the full layer.
      parameters:
        - $ref: '#/components/parameters/layerId'
        - in: query
          name: detail
          schema:
            type: string
            enum: [overview, full]
            default: overview
          description: Overview returns viewport-aware aggregate or simplified geometry for map review. Full returns registered GeoJSON geometry for the requested viewport and is still capped for client safety.
        - in: query
          name: geometry
          schema:
            type: string
            enum: [aggregate, simplified, full]
            default: aggregate
          description: Geometry representation for the payload. Aggregate returns grouped point features with class counts. Simplified preserves geometry type with reduced coordinates. Full preserves registered geometry and requires detail=full.
        - in: query
          name: bounds
          schema:
            type: string
          description: Optional viewport bounds as west,south,east,north. Only intersecting features are returned.
        - in: query
          name: zoom
          schema:
            type: number
          description: Optional map zoom used to choose aggregation grid size or simplification tolerance.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 2500
            default: 1800
          description: Maximum number of features or aggregate cells returned by this request. The total_count still reports the whole registered layer.
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page of full-layer or viewport features to return. Used by the AI feature browser to load all layer features in small pages without changing total_count.
        - in: query
          name: q
          schema:
            type: string
          description: Optional full-layer search term for the AI feature browser. Searches feature ids, class labels, model/source metadata, and run ids before pagination.
        - in: query
          name: class_label
          schema:
            type: string
          description: Optional full-layer predicted class filter applied before pagination.
      responses:
        '200':
          description: AI layer GeoJSON preview payload with total_count, visible_count, returned_count, capped, cap, pagination, class_counts, geometry_types, and feature_collection.
        '400':
          description: Layer is not previewable or artifact path is unsafe
        '403':
          description: Forbidden
        '404':
          description: AI layer or artifact not found
  /api/v1/ai/uncertainty-areas/{uncertaintyAreaId}:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Get an AI uncertainty validation task
      description: Admins can read any task. Contributors can read only tasks assigned to them. Viewers are denied.
      parameters:
        - $ref: '#/components/parameters/uncertaintyAreaId'
      responses:
        '200':
          description: AI uncertainty validation task
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Task not found
  /api/v1/ai/uncertainty-areas/{uncertaintyAreaId}/assign:
    patch:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Assign an AI uncertainty validation task
      description: Admin and protected super-admin management endpoint. Assigns a registered uncertainty task to an approved contributor on the same project. Does not write to spatial_feature.
      parameters:
        - $ref: '#/components/parameters/uncertaintyAreaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiUncertaintyAssignRequest'
      responses:
        '200':
          description: Task assigned
        '400':
          description: Invalid payload
        '403':
          description: Forbidden
        '404':
          description: Task not found
        '409':
          description: Task cannot be assigned in its current status
        '422':
          description: Assignee is not an approved contributor for the project
  /api/v1/ai/uncertainty-areas/{uncertaintyAreaId}/status:
    patch:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Update an AI uncertainty validation task status
      description: Admin and protected super-admin management endpoint. Marking a task validated requires an already approved spatial_feature in the same project; this endpoint never approves field data itself.
      parameters:
        - $ref: '#/components/parameters/uncertaintyAreaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiUncertaintyStatusRequest'
      responses:
        '200':
          description: Task status updated
        '400':
          description: Invalid payload
        '403':
          description: Forbidden
        '404':
          description: Task or feature not found
        '409':
          description: Feature status is not valid for the requested task status
        '422':
          description: Required validation feature is missing or belongs to another project
  /api/v1/ai/uncertainty-areas/{uncertaintyAreaId}/submit-validation:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Submit contributor validation for an AI uncertainty task
      description: Assigned contributors link a task to their own draft or pending-review spatial_feature. Draft features are submitted to the normal pending_review workflow; this endpoint never approves spatial_feature records.
      parameters:
        - $ref: '#/components/parameters/uncertaintyAreaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiUncertaintySubmitValidationRequest'
      responses:
        '200':
          description: Validation submitted through normal feature review
        '400':
          description: Invalid payload
        '403':
          description: Forbidden
        '404':
          description: Task or feature not found
        '409':
          description: Task or feature is not in a submittable status
        '422':
          description: Feature belongs to a different project
  /api/v1/ai/layers/{layerId}/publish:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Publish an approved AI output layer as a read-only map overlay
      description: Protected super-admin only. The layer must already be approved and project AI must be enabled. Publishing sets status=published and published metadata, writes an AI run log, and does not insert predictions into spatial_feature.
      parameters:
        - $ref: '#/components/parameters/layerId'
      responses:
        '200':
          description: AI output layer published
        '400':
          description: Layer is not publishable
        '403':
          description: Forbidden
        '404':
          description: AI layer not found
        '409':
          description: Layer is not approved or project AI is disabled
  /api/v1/ai/layers/{layerId}/unpublish:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Remove viewer visibility for a published AI output layer
      description: Protected super-admin only. Unpublishing returns the layer to approved status, clears viewer publication metadata, writes an AI run log, and does not touch spatial_feature.
      parameters:
        - $ref: '#/components/parameters/layerId'
      responses:
        '200':
          description: AI output layer unpublished
        '403':
          description: Forbidden
        '404':
          description: AI layer not found
        '409':
          description: Layer is not published
  /api/v1/ai/runs/{runId}/reviews:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI run review decisions
      description: Protected super-admin only. Returns admin review history for AI run outputs; it does not expose AI layers to viewers.
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI review decision list
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/review:
    post:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: Review AI run results for future publication
      description: Protected super-admin only. Records a review decision and updates AI output layer review status. This endpoint does not publish viewer-facing map layers and never inserts AI predictions into spatial_feature.
      parameters:
        - $ref: '#/components/parameters/runId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRunReviewRequest'
      responses:
        '200':
          description: AI review decision saved
        '400':
          description: Invalid review payload
        '403':
          description: Forbidden
        '404':
          description: AI run not found
  /api/v1/ai/runs/{runId}/logs:
    get:
      tags: [AI]
      security:
        - bearerAuth: []
      summary: List AI run logs
      parameters:
        - $ref: '#/components/parameters/runId'
      responses:
        '200':
          description: AI run log list
        '403':
          description: Forbidden
        '404':
          description: AI run not found

  /api/v1/features:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: List features with filters
      responses:
        '200':
          description: Feature list
        '401':
          description: Unauthorized
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Create feature
      responses:
        '201':
          description: Feature created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/batch:
    post:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Batch create features (offline sync)
      responses:
        '201':
          description: Batch created
        '400':
          description: Validation failed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/nearby:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Find nearby approved features
      responses:
        '200':
          description: Nearby features
        '400':
          description: Invalid query
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/bbox:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Query features by BBOX (GeoJSON FeatureCollection)
      parameters:
        - in: query
          name: minLon
          required: true
          schema:
            type: number
        - in: query
          name: minLat
          required: true
          schema:
            type: number
        - in: query
          name: maxLon
          required: true
          schema:
            type: number
        - in: query
          name: maxLat
          required: true
          schema:
            type: number
      responses:
        '200':
          description: GeoJSON feature collection
        '400':
          description: Invalid query
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v1/features/{featureId}:
    get:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Get feature by ID
      parameters:
        - $ref: '#/components/parameters/featureId'
      responses:
        '200':
          description: Feature detail
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    put:
      tags: [Features]
      security:
        - bearerAuth: []
      summary: Update draft feature
      parameters:
