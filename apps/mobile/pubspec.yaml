name: lebanese_gis_mobile
description: TerraLeb mobile GIS and AI land intelligence app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.6.1
  go_router: ^17.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  flutter_map: ^8.3.1
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  uuid: ^4.5.1
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  file_picker: ^11.0.2
  web_socket_channel: ^3.0.3
  timezone: ^0.11.0
  connectivity_plus: ^7.1.1
  flutter_foreground_task: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
