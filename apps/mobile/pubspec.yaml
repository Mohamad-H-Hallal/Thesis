name: lebanese_gis_mobile
description: AI-Enhanced Geospatial Mobile GIS Collector UI foundation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.6.1
  go_router: ^17.1.0
  dio: ^5.9.0
  flutter_secure_storage: ^10.0.0
  flutter_map: ^7.0.2
  flutter_svg: ^2.0.17
  image_picker: ^1.1.2
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_placeholder.svg
