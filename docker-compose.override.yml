services:
  db:
    ports:
      - "55433:5432"

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /workspace/apps/api
    environment:
      MIGRATIONS_DIR: /workspace/infra/migrations
    command:
      [
        "sh",
        "-lc",
        "sh /workspace/apps/api/docker/dev-entrypoint.sh npm run migrate",
      ]
    volumes:
      - .:/workspace
      - api_node_modules:/workspace/apps/api/node_modules

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /workspace/apps/api
    environment:
      MIGRATIONS_DIR: /workspace/infra/migrations
    command:
      [
        "sh",
        "-lc",
        "sh /workspace/apps/api/docker/dev-entrypoint.sh npm run dev:docker",
      ]
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - ./secrets:/run/app-secrets:ro
      - api_node_modules:/workspace/apps/api/node_modules
      - api_uploads:/workspace/apps/api/uploads
      - api_exports:/workspace/apps/api/exports

  nginx:
    ports:
      - "8088:8080"

  adminer:
    image: adminer:4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    profiles:
      - devtools

volumes:
  api_node_modules:
