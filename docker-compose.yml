name: ${COMPOSE_PROJECT_NAME:-gis_app}

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/db/migrate.js"]
    restart: "no"

  clamav:
    image: clamav/clamav:1.5.3-debian@sha256:9ea1c2bc1955c58d094bb3d168718d0173c7899096012523278ad76e06cc75a2
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G

  valkey:
    image: valkey/valkey:8.1.9-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    expose:
      - "6379"
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD to a URL-safe secret}
    command:
      [
        "sh",
        "-c",
        "exec valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\"",
      ]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      WORKLOAD_WORKER_MODE: external
      WORKLOAD_HARD_EXIT_ON_TIMEOUT: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      valkey:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - ./secrets:/run/app-secrets:ro
      - api_uploads:/app/apps/api/uploads
      - api_exports:/app/apps/api/exports
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  workload-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      RATE_LIMIT_STORE: redis
      REDIS_URL: redis://:${VALKEY_PASSWORD}@valkey:6379
      WORKLOAD_WORKER_MODE: external
      WORKLOAD_HARD_EXIT_ON_TIMEOUT: "true"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    volumes:
      - ./secrets:/run/app-secrets:ro
      - api_uploads:/app/apps/api/uploads
      - api_exports:/app/apps/api/exports
    command: ["node", "dist/jobs/runWorkloadWorker.js"]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/mobile/build/web:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  postgis_data:
    name: ${POSTGIS_DATA_VOLUME:-gis_app_postgis_data}
  api_uploads:
    name: ${API_UPLOADS_VOLUME:-gis_app_api_uploads}
  api_exports:
    name: ${API_EXPORTS_VOLUME:-gis_app_api_exports}
  clamav_signatures:
    name: ${CLAMAV_SIGNATURES_VOLUME:-gis_app_clamav_signatures}
  valkey_data:
    name: ${VALKEY_DATA_VOLUME:-gis_app_valkey_data}
